appId: dev.thibault.maison-des-agents
productName: Maison des Agents
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack: []
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  target: [AppImage, deb]
  syncDesktopName: true
deb:
  artifactName: maison-des-agents_amd64.deb
